<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Sports Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <div class="tabs">
            <button class="tab-button active px-4 py-2 rounded bg-gray-800 hover:bg-gray-700" onclick="openTab(event, 'LiveScores')">Live Scores</button>
            <button class="tab-button px-4 py-2 rounded bg-gray-800 hover:bg-gray-700" onclick="openTab(event, 'Fixtures')">Fixtures</button>
            <button class="tab-button px-4 py-2 rounded bg-gray-800 hover:bg-gray-700" onclick="openTab(event, 'Standings')">Standings</button>
        </div>

        <div id="LiveScores" class="tab-content active p-4 rounded bg-gray-800 shadow-lg">
            <h2 class="text-xl font-bold mb-2">Live Scores</h2>
            <div id="matches-container"></div>
        </div>

        <div id="Fixtures" class="tab-content p-4 rounded bg-gray-800 shadow-lg">
            <h2 class="text-xl font-bold mb-2">Fixtures</h2>
            <div id="matches-container"></div>
        </div>

        <div id="Standings" class="tab-content p-4 rounded bg-gray-800 shadow-lg">
            <h2 class="text-xl font-bold mb-2">Standings</h2>
            <div id="matches-container"></div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Initialize the first tab
        document.getElementById("LiveScores").style.display = "block";
    </script>
</body>
</html>
